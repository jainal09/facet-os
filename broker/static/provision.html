<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facet — Wi-Fi setup</title>
<style>
  :root {
    --bg:#0A0E14; --card:#11161F; --line:#1B2432;
    --ink:#E2E8F0; --dim:#64748B; --mid:#C7D2E0;
    --accent:#60A5FA; --ok:#34D399; --warn:#FB923C; --bad:#F87171;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; padding:20px 16px 48px; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:560px; margin-inline:auto;
  }
  h1 { font-size:20px; letter-spacing:3px; margin:0 0 4px; color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }
  .card h2 {
    font-size:13px; letter-spacing:3px; margin:0 0 12px; color:var(--accent);
    text-transform:uppercase; font-weight:600;
  }
  button {
    width:100%; min-height:48px; border-radius:12px; border:1px solid var(--accent);
    background:#1B2432; color:var(--ink); font-size:16px; font-family:inherit;
    cursor:pointer; padding:12px;
  }
  button:active { background:var(--accent); color:#0A0E14; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { border-color:var(--line); }
  button.danger { border-color:var(--bad); color:var(--bad); }
  input {
    width:100%; min-height:48px; border-radius:12px; border:1px solid var(--line);
    background:#0A0E14; color:var(--ink); padding:12px 14px; font-size:16px;
    font-family:inherit;
  }
  input:focus { outline:none; border-color:var(--accent); }
  input.code {
    text-align:center; letter-spacing:14px; font-size:28px; font-variant-numeric:tabular-nums;
    padding-left:14px; text-indent:14px;
  }
  .net {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 14px; margin-bottom:8px; border-radius:12px;
    border:1px solid var(--line); background:#0A0E14; min-height:auto;
  }
  .net:active { background:var(--line); color:var(--ink); }
  .net .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .net .meta { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; flex:none; }
  .net.current { border-color:var(--ok); }
  .net.current .name::before { content:"\2713  "; color:var(--ok); }
  .bars { display:inline-flex; gap:2px; align-items:flex-end; height:14px; flex:none; }
  .bars i { width:3px; background:var(--dim); border-radius:1px; }
  .bars i.on { background:var(--mid); }
  .bars i:nth-child(1){height:4px} .bars i:nth-child(2){height:7px}
  .bars i:nth-child(3){height:10px} .bars i:nth-child(4){height:14px}
  .lock { color:var(--dim); font-size:12px; flex:none; }
  .status { font-size:14px; color:var(--mid); min-height:21px; }
  .status.err { color:var(--bad); }
  .status.ok  { color:var(--ok); }
  .status.work{ color:var(--warn); }
  .hide { display:none !important; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .hint { color:var(--dim); font-size:12px; margin-top:10px; }
  .spin {
    display:inline-block; width:14px; height:14px; vertical-align:-2px;
    margin-right:8px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spin { animation-duration:2.4s; } }
  code { background:#0A0E14; padding:2px 6px; border-radius:5px; font-size:13px; }
</style>
</head>
<body>

<h1>FACET</h1>
<div class="sub">Wi-Fi setup over Bluetooth</div>

<div class="card" id="cardConnect">
  <h2>Connect</h2>
  <button id="btnConnect">Find my cube</button>
  <div class="hint" id="hintSupport"></div>
</div>

<div class="card hide" id="cardCode">
  <h2>Pairing code</h2>
  <div class="sub" style="margin:0 0 12px">Type the six digits shown on the cube.</div>
  <input class="code" id="inCode" inputmode="numeric" pattern="[0-9]*" maxlength="6"
         autocomplete="one-time-code" placeholder="000000">
  <div style="height:10px"></div>
  <button id="btnCode">Unlock</button>
</div>

<div class="card hide" id="cardNets">
  <h2>Networks</h2>
  <div id="netList"></div>
  <button class="ghost" id="btnRescan">Scan again</button>
  <div class="hint" id="rescanHint">Captured when pairing started.</div>
</div>

<div class="card hide" id="cardPass">
  <h2 id="passTitle">Password</h2>
  <input id="inPass" type="password" autocomplete="current-password" placeholder="Network password">
  <div style="height:10px"></div>
  <div class="row">
    <button class="ghost" id="btnPassCancel">Back</button>
    <button id="btnJoin">Join</button>
  </div>
</div>

<div class="card">
  <h2>Status</h2>
  <div class="status" id="status">Not connected.</div>
</div>

<script>
"use strict";

/* Must match the UUIDs in main/ble_prov.c. */
const SVC     = "f9a30001-0b45-4f7e-9c2a-6d1e8b3c7a51";
const C_PUB   = "f9a30002-0b45-4f7e-9c2a-6d1e8b3c7a51";
const C_SESS  = "f9a30003-0b45-4f7e-9c2a-6d1e8b3c7a51";
const C_CMD   = "f9a30004-0b45-4f7e-9c2a-6d1e8b3c7a51";
const C_DATA  = "f9a30005-0b45-4f7e-9c2a-6d1e8b3c7a51";
const C_STATE = "f9a30006-0b45-4f7e-9c2a-6d1e8b3c7a51";

const CMD_HELLO = 0x01, CMD_SCAN = 0x02, CMD_JOIN = 0x03,
      CMD_WIFI_OFF = 0x04, CMD_BYE = 0x05, CMD_RESCAN = 0x06;
const RSP_APLIST = 0x81;

/* State numbering is the wire contract with ble_prov.h — index, don't reorder. */
const ST_HANDOFF = 4, ST_DONE = 5;
const ERRS = ["", "Wrong code.", "Too many wrong codes — start pairing again on the cube.",
              "", "Something failed on the cube.",
              ""];   /* 5 = rescan refused: expected, reported under the button */

/* Set once the cube has taken the credentials, so the disconnect that follows
 * reads as success rather than as a fault. The cube closes Bluetooth on purpose:
 * it cannot run both radios at once, so it has to let go to join Wi-Fi. */
let handedOff = false;

const $ = (id) => document.getElementById(id);

/* A GATT read hands back a DataView, and `dv.buffer` is the WHOLE underlying
 * buffer — which equals the value only if the implementation happened to
 * allocate it that way. Chrome does; Bluefy is a separate WebKit-based
 * implementation and there is no spec guarantee either way. Respecting
 * byteOffset/byteLength is correct against both and costs nothing. */
const bytes = (dv) => new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
const enc = new TextEncoder();

let chars = {};          /* the five characteristics                        */
let sessionKey = null;   /* AES-GCM CryptoKey                               */
let txCtr = 0n, rxCtr = 0n;
let lastSeq = -1;
let selected = null;     /* the network being joined                        */
let currentSsid = "";

/* ---- ui helpers ------------------------------------------------------- */

function say(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
function show(id, on) { $(id).classList.toggle("hide", !on); }

/* Everything that belongs to one pairing session, cleared in one place.
 * The cube restarts its own counters on every session — a fresh key, tx/rx from
 * zero, data_seq from zero — so anything remembered from the previous one is
 * actively wrong. lastSeq was the sharp edge: left at its old value, the page
 * decides it has already seen the network list the cube is now advertising as
 * new, and silently shows nothing. */
function resetSession() {
  chars = {};
  sessionKey = null;
  txCtr = 0n; rxCtr = 0n;
  lastSeq = -1;
  handedOff = false;
  selected = null;
  currentSsid = "";
  $("inCode").value = "";
  $("inPass").value = "";
  $("netList").innerHTML = "";
  $("rescanHint").textContent = "Captured when pairing started.";
  $("btnRescan").disabled = false;
}

/* ---- crypto ------------------------------------------------------------
 * Mirrors ble_prov.c exactly: ECDH P-256 -> HKDF-SHA256 salted with the six
 * digits -> AES-256-GCM. Nonce is [dir][0,0,0][counter big-endian, 8 bytes];
 * the wire frame is [nonce 12][ciphertext][tag 16]. */

function nonce(dir, ctr) {
  const n = new Uint8Array(12);
  n[0] = dir;
  const dv = new DataView(n.buffer);
  dv.setBigUint64(4, ctr);
  return n;
}

async function seal(plain) {
  txCtr += 1n;
  const iv = nonce(0x01, txCtr);                       /* 0x01 = phone -> cube */
  const ct = new Uint8Array(await crypto.subtle.encrypt(
    { name: "AES-GCM", iv, tagLength: 128 }, sessionKey, plain));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv, 0);
  out.set(ct, 12);
  return out;
}

async function unseal(frame) {
  if (frame.length < 28) throw new Error("short frame");
  const iv = frame.slice(0, 12);
  if (iv[0] !== 0x00) throw new Error("wrong direction");
  const ctr = new DataView(iv.buffer, iv.byteOffset).getBigUint64(4);
  if (ctr <= rxCtr) throw new Error("replay");
  const pt = new Uint8Array(await crypto.subtle.decrypt(
    { name: "AES-GCM", iv, tagLength: 128 }, sessionKey, frame.slice(12)));
  rxCtr = ctr;
  return pt;
}

async function handshake(code) {
  /* 1. the cube's ephemeral point */
  const pub = bytes(await chars.pub.readValue());
  if (pub.length !== 66 || pub[0] !== 1) throw new Error("unexpected protocol version");
  const cubePoint = pub.slice(1);

  /* 2. ours, sent raw and uncompressed — the 65-byte form mbedtls reads */
  const kp = await crypto.subtle.generateKey(
    { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const ourPoint = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey));
  await chars.sess.writeValueWithResponse(ourPoint);

  /* 3. shared secret -> session key. deriveBits gives the X coordinate,
   *    which is what mbedtls_ecdh_compute_shared writes on the other side. */
  const peer = await crypto.subtle.importKey(
    "raw", cubePoint, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const shared = await crypto.subtle.deriveBits(
    { name: "ECDH", public: peer }, kp.privateKey, 256);

  const hk = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveBits"]);
  const keyBits = await crypto.subtle.deriveBits(
    { name: "HKDF", hash: "SHA-256", salt: enc.encode(code), info: enc.encode("facet-prov-v1") },
    hk, 256);
  sessionKey = await crypto.subtle.importKey(
    "raw", keyBits, "AES-GCM", false, ["encrypt", "decrypt"]);
  txCtr = 0n; rxCtr = 0n;

  /* 4. HELLO is the proof. If the digits were wrong the cube cannot open it. */
  const hello = new Uint8Array(9);
  hello[0] = CMD_HELLO;
  hello.set(enc.encode("FACETPRV"), 1);
  await chars.cmd.writeValueWithResponse(await seal(hello));
}

/* ---- protocol ---------------------------------------------------------- */

async function send(bytes) {
  await chars.cmd.writeValueWithResponse(await seal(bytes));
}

async function readAplist() {
  const raw = bytes(await chars.data.readValue());
  const pt = await unseal(raw);
  if (pt[0] !== RSP_APLIST) throw new Error("unexpected payload");

  let o = 1;
  const curLen = pt[o++];
  currentSsid = new TextDecoder().decode(pt.slice(o, o + curLen)); o += curLen;
  const count = pt[o++];

  const nets = [];
  for (let i = 0; i < count && o < pt.length; i++) {
    const len = pt[o++];
    const ssid = new TextDecoder().decode(pt.slice(o, o + len)); o += len;
    const rssi = (pt[o++] << 24) >> 24;            /* sign-extend one byte */
    const secure = pt[o++] === 1;
    nets.push({ ssid, rssi, secure });
  }
  renderNets(nets);
}

function bars(rssi) {
  const n = rssi >= -55 ? 4 : rssi >= -67 ? 3 : rssi >= -78 ? 2 : 1;
  let h = '<span class="bars">';
  for (let i = 1; i <= 4; i++) h += `<i class="${i <= n ? "on" : ""}"></i>`;
  return h + "</span>";
}

function renderNets(nets) {
  const list = $("netList");
  list.innerHTML = "";

  nets.sort((a, b) => (b.ssid === currentSsid) - (a.ssid === currentSsid) || b.rssi - a.rssi);

  if (!nets.length) {
    list.innerHTML = '<div class="sub">No networks found.</div>';
    return;
  }

  for (const net of nets) {
    const isCur = net.ssid === currentSsid && currentSsid !== "";
    const b = document.createElement("button");
    b.className = "net" + (isCur ? " current" : "");
    b.innerHTML =
      `<span class="name"></span>` +
      `<span class="lock">${net.secure ? "\u{1F512}" : ""}</span>` +
      bars(net.rssi) +
      `<span class="meta">${net.rssi}</span>`;
    b.querySelector(".name").textContent = net.ssid;   /* never innerHTML — an
                                                          SSID is attacker-chosen */
    b.onclick = () => (isCur ? offerDisconnect(net) : pick(net));
    list.appendChild(b);
  }
  show("cardNets", true);
}

function pick(net) {
  selected = net;
  if (!net.secure) return join("");
  $("passTitle").textContent = "Password";
  $("inPass").value = "";
  show("cardPass", true);
  $("inPass").focus();
}

async function offerDisconnect(net) {
  if (!confirm(`Disconnect from ${net.ssid}?`)) return;
  say("Disconnecting…", "work");
  await send(new Uint8Array([CMD_WIFI_OFF]));
}

async function join(pass) {
  const ssid = enc.encode(selected.ssid);
  const pw = enc.encode(pass);
  const msg = new Uint8Array(2 + ssid.length + 1 + pw.length);
  let o = 0;
  msg[o++] = CMD_JOIN;
  msg[o++] = ssid.length; msg.set(ssid, o); o += ssid.length;
  msg[o++] = pw.length;   msg.set(pw, o);
  show("cardPass", false);
  say(`Joining ${selected.ssid}…`, "work");
  await send(msg);
}

/* ---- state notifications ----------------------------------------------- */

async function onState(ev) {
  const v = bytes(ev.target.value);
  const [state, err, seq] = v;

  if (err === 5) {
    /* Not a fault: the cube turns Wi-Fi off to free the memory Bluetooth needs,
       so a live rescan does not fit yet. Said once, quietly, where the button
       that caused it is. */
    $("btnRescan").disabled = false;
    $("rescanHint").textContent =
      "Live rescan does not fit alongside Bluetooth yet. Showing the networks "
      + "found when pairing started.";
  }

  if (err && ERRS[err]) {
    say(ERRS[err], "err");
    if (err === 1) { sessionKey = null; show("cardCode", true); show("cardNets", false); }
  } else if (state === ST_HANDOFF || state === ST_DONE) {
    handedOff = true;
    say("Sent. The cube is switching Bluetooth off and joining — watch its screen.", "ok");
    show("cardNets", false); show("cardPass", false); show("cardCode", false);
    /* Pairing again needs a fresh code from the cube, so offer the way back
       rather than leaving the page with nothing to press. */
    show("cardConnect", true);
  } else if (state === 3 && sessionKey && !err) {
    say("Ready.", "ok");
  }

  /* The cube bumps the sequence whenever DATA changes; that is the only cue
     to re-read it, since notifications carry no payload of their own. */
  if (sessionKey && seq !== lastSeq) {
    lastSeq = seq;
    try {
      await readAplist();
    } catch (e) {
      /* Swallowing this hid the only symptom the user can see: the cube says it
         sent a list and the phone shows nothing at all. */
      say("Got the list but could not read it: " + (e.message || e), "err");
      console.warn("aplist", e);
    }
  }
}

/* ---- wiring ------------------------------------------------------------ */

$("btnConnect").onclick = async () => {
  try {
    resetSession();
    say("Looking for the cube…", "work");
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    dev.addEventListener("gattserverdisconnected", () => {
      /* Expected after a hand-off — the cube closes Bluetooth to free the
         memory Wi-Fi needs. Only a disconnect before that is a fault. */
      if (handedOff) {
        say("Sent. The cube is joining now — watch its screen.", "ok");
      } else {
        say("Cube disconnected.", "err");
      }
      sessionKey = null;
      show("cardNets", false); show("cardPass", false); show("cardCode", false);
      show("cardConnect", true);
    });

    const gatt = await dev.gatt.connect();
    const svc = await gatt.getPrimaryService(SVC);
    chars.pub   = await svc.getCharacteristic(C_PUB);
    chars.sess  = await svc.getCharacteristic(C_SESS);
    chars.cmd   = await svc.getCharacteristic(C_CMD);
    chars.data  = await svc.getCharacteristic(C_DATA);
    chars.state = await svc.getCharacteristic(C_STATE);

    await chars.state.startNotifications();
    chars.state.addEventListener("characteristicvaluechanged", onState);

    show("cardConnect", false);
    show("cardCode", true);
    $("inCode").focus();
    say("Connected. Enter the code shown on the cube.");
  } catch (e) {
    say(e.message || String(e), "err");
  }
};

$("btnCode").onclick = async () => {
  const code = $("inCode").value.trim();
  if (!/^\d{6}$/.test(code)) { say("Six digits, please.", "err"); return; }
  try {
    say("Checking…", "work");
    await handshake(code);
    show("cardCode", false);
    say("Unlocked. Scanning…", "work");
    await send(new Uint8Array([CMD_SCAN]));
  } catch (e) {
    sessionKey = null;
    say(e.message || String(e), "err");
  }
};

$("btnRescan").onclick = async () => {
  const btn = $("btnRescan");
  if (btn.disabled) return;
  btn.disabled = true;
  const seqBefore = lastSeq;
  $("rescanHint").innerHTML = '<span class="spin"></span>Scanning — the cube is '
    + 'switching Wi-Fi back on, this takes a few seconds.';
  try {
    await send(new Uint8Array([CMD_RESCAN]));
    /* The cube answers by bumping data_seq, which onState() turns into a fresh
       read. Wait for that rather than guessing a duration — bringing Wi-Fi up,
       scanning and taking it down again takes several seconds and varies. */
    const ok = await new Promise((resolve) => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        if (lastSeq !== seqBefore) { clearInterval(iv); resolve(true); }
        else if (Date.now() - t0 > 20000) { clearInterval(iv); resolve(false); }
      }, 200);
    });
    $("rescanHint").textContent = ok ? "Updated just now."
                                     : "No answer from the cube — try again.";
  } catch (e) {
    $("rescanHint").textContent = e.message || String(e);
  } finally {
    btn.disabled = false;
  }
};

$("btnJoin").onclick = () => join($("inPass").value).catch(e => say(e.message, "err"));
$("btnPassCancel").onclick = () => show("cardPass", false);
$("inCode").onkeydown = (e) => { if (e.key === "Enter") $("btnCode").click(); };
$("inPass").onkeydown = (e) => { if (e.key === "Enter") $("btnJoin").click(); };

if (!navigator.bluetooth) {
  $("btnConnect").disabled = true;
  $("hintSupport").innerHTML =
    "This browser has no Web Bluetooth. On iPhone use <b>Bluefy</b> from the App Store; " +
    "on Android or desktop use Chrome. The page must be served over <code>https</code>.";
}
</script>
</body>
</html>
